name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: BZBZNScanner.exe
          - os: ubuntu-latest
            platform: linux
            artifact_name: BZBZNScanner
          - os: macos-latest
            platform: macos
            artifact_name: BZBZNScanner

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow

    - name: Run tests
      run: python -m unittest discover -s tests -v

    - name: Generate canonical app icon (BZNTools artwork)
      run: python scripts/generate_app_icon.py branding/app_icon.svg branding/app_icon.ico --png branding/app_icon.png

    - name: Resolve package version
      id: version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="$(tr -d '[:space:]' < VERSION)"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Generate Windows version metadata
      if: runner.os == 'Windows'
      run: |
        python scripts/generate_version_info.py --version "${{ steps.version.outputs.version }}" --output branding/version_info.txt

    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --name "BZBZNScanner" --icon "branding/app_icon.ico" --version-file "branding/version_info.txt" --add-data "branding/app_icon.ico;branding" --add-data "branding/app_icon.png;branding" --runtime-hook branding/pyinstaller_icon_hook.py scanner_app.py

    - name: Build executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile --name "BZBZNScanner" --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --runtime-hook branding/pyinstaller_icon_hook.py scanner_app.py

    - name: Build executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onefile --windowed --name "BZBZNScanner" --icon "branding/app_icon.ico" --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" --runtime-hook branding/pyinstaller_icon_hook.py scanner_app.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Battlezone98Redux_BZN_Scanner-${{ matrix.platform }}
        path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: "${{ success() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): v'))) }}"
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Resolve release tag
      id: release_version
      shell: bash
      run: |
        if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
          tag="$GITHUB_REF_NAME"
        else
          tag="v$(tr -d '[:space:]' < VERSION)"
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Package release archives
      shell: bash
      env:
        RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
      run: |
        set -euo pipefail
        mkdir -p release-packages/windows release-packages/linux release-packages/macos

        cp release-artifacts/Battlezone98Redux_BZN_Scanner-windows/BZBZNScanner.exe release-packages/windows/
        cp release-artifacts/Battlezone98Redux_BZN_Scanner-linux/BZBZNScanner release-packages/linux/
        cp release-artifacts/Battlezone98Redux_BZN_Scanner-macos/BZBZNScanner release-packages/macos/

        chmod +x release-packages/linux/BZBZNScanner release-packages/macos/BZBZNScanner

        (cd release-packages/windows && zip -q ../Battlezone98Redux_BZN_Scanner-${RELEASE_TAG}-windows.zip BZBZNScanner.exe)
        (cd release-packages/linux && tar -czf ../Battlezone98Redux_BZN_Scanner-${RELEASE_TAG}-linux.tar.gz BZBZNScanner)
        (cd release-packages/macos && tar -czf ../Battlezone98Redux_BZN_Scanner-${RELEASE_TAG}-macos.tar.gz BZBZNScanner)

        ls -lh release-packages/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_version.outputs.tag }}
        name: ${{ steps.release_version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: |
          release-packages/Battlezone98Redux_BZN_Scanner-v*-windows.zip
          release-packages/Battlezone98Redux_BZN_Scanner-v*-linux.tar.gz
          release-packages/Battlezone98Redux_BZN_Scanner-v*-macos.tar.gz
        fail_on_unmatched_files: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
