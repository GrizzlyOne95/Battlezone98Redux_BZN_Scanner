name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --name "bzn_scan" bzn_scan.py
    
    - name: Build executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --onefile --name "bzn_scan" bzn_scan.py
    
    - name: Build executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --onefile --windowed --name "bzn_scan" bzn_scan.py
    
    - name: List build artifacts
      run: |
        echo "Checking dist directory..."
        if [ -d "dist" ]; then ls -la dist/; else echo "dist directory not found"; fi
      shell: bash
    
    - name: Upload artifacts (Windows)
      if: runner.os == 'Windows' && hashFiles('dist/bzn_scan.exe') != ''
      uses: actions/upload-artifact@v4
      with:
        name: bzn_scan-windows
        path: dist/bzn_scan.exe
    
    - name: Upload artifacts (Linux)
      if: runner.os == 'Linux' && hashFiles('dist/bzn_scan') != ''
      uses: actions/upload-artifact@v4
      with:
        name: bzn_scan-linux
        path: dist/bzn_scan
    
    - name: Upload artifacts (macOS)
      if: runner.os == 'macOS' && hashFiles('dist/bzn_scan') != ''
      uses: actions/upload-artifact@v4
      with:
        name: bzn_scan-macos
        path: dist/bzn_scan
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
    
    - name: List artifacts
      run: |
        echo "Artifacts downloaded:"
        find . -type f -name "bzn_scan*" 2>/dev/null || echo "No artifacts found"
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          bzn_scan-windows/bzn_scan.exe
          bzn_scan-linux/bzn_scan
          bzn_scan-macos/bzn_scan
        fail_on_unmatched_files: false
